%YAML:1.0

# Independent tracking-evidence configuration.  It keeps the same VIO/BNR
# parameters as irvio_dual_proxy_euroc_no_loop.yaml and only adds a CSV with
# LK attempts/successes, post-RANSAC counts and BNR counts.  The enhanced
# image is still a clean-room proxy, not an author IR-VIO checkpoint.
imu_topic: "/imu0"
image_topic: "/cam0/image_raw"
enhanced_image_topic: "/cam0/image_enhanced"
output_path: "/results/vins_result.csv"

model_type: PINHOLE
camera_name: camera
image_width: 752
image_height: 480
distortion_parameters:
   k1: -2.917e-01
   k2: 8.228e-02
   p1: 5.333e-05
   p2: -1.578e-04
projection_parameters:
   fx: 4.616e+02
   fy: 4.603e+02
   cx: 3.630e+02
   cy: 2.481e+02

estimate_extrinsic: 0
extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0.0148655429818, -0.999880929698, 0.00414029679422,
           0.999557249008, 0.0149672133247, 0.025715529948,
           -0.0257744366974, 0.00375618835797, 0.999660727178]
extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [-0.0216401454975, -0.064676986768, 0.00981073058949]

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
equalize: 0
fisheye: 0

bnr_enable: 1
bnr_grid_rows: 6
bnr_grid_cols: 8
bnr_ratio_threshold: 10.8
bnr_min_keep: 8
bnr_log_path: "/results/bnr_frames.csv"
tracking_stats_log_path: "/results/tracking_stats.csv"

max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 0.08
gyr_n: 0.02
acc_w: 0.0002
gyr_w: 2.0e-5
g_norm: 9.81007

loop_closure: 0
pattern_file: "/src/VINS-Mono/support_files/brief_pattern.yml"
voc_file: "/src/VINS-Mono/support_files/brief_k10L6.bin"
min_loop_num: 25

adaptive_weighting: 1
adaptive_source_separation: 1
adaptive_delta_alpha: 4.0
adaptive_delta_beta: 4.0
adaptive_sigma_image: 1.0
adaptive_info_regularization: 1.0e-6
adaptive_reference_update_rate: 0.05
adaptive_weight_log_path: "/results/adaptive_weights.csv"
